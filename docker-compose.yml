services:
  php_vinsen:
    build:
      context: ./php
      args:
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
    image: vinsen-php:${IMAGE_TAG:-latest}
    container_name: php_vinsen
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    env_file:
      - ./src/.env
    environment:
      BROADCAST_CONNECTION: reverb
      REVERB_INTERNAL_HOST: reverb_vinsen
      REVERB_INTERNAL_PORT: 8080
      REVERB_INTERNAL_SCHEME: http
      RUN_SCHEDULER: "true"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./src:/var/www/html
      - ./php/www.conf:/usr/local/etc/php-fpm.d/zz-vinsen.conf:ro
    expose:
      - "9000"
    depends_on:
      db_vinsen:
        condition: service_started
    networks:
      - vinsen_network

  reverb_vinsen:
    build:
      context: ./php
      args:
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
    image: vinsen-php:${IMAGE_TAG:-latest}
    container_name: reverb_vinsen
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    env_file:
      - ./src/.env
    environment:
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      RUN_SCHEDULER: "false"
      XDEBUG: "false"
    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080
    volumes:
      - ./src:/var/www/html
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$socket = @fsockopen("127.0.0.1", 8080);
          if (!$$socket) { exit(1); } fclose($$socket);'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
    networks:
      - vinsen_network

  db_vinsen:
    image: mariadb:10.2
    container_name: db_vinsen
    restart: unless-stopped
    tty: true
    ports:
      - "${DB_FORWARD_PORT:-33302}:3306"
    volumes:
      - ./database/data:/var/lib/mysql
      - ./database/conf.d:/etc/mysql/conf.d:ro
    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: 123
      MYSQL_ROOT_PASSWORD: 123
      TZ: Asia/Jakarta
    networks:
      - vinsen_network

  nginx_vinsen:
    build:
      context: ./nginx
    image: vinsen-nginx:${IMAGE_TAG:-latest}
    container_name: nginx_vinsen
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-16}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php_vinsen:
        condition: service_started
      reverb_vinsen:
        condition: service_healthy
    networks:
      - vinsen_network

networks:
  vinsen_network:
    name: ${COMPOSE_PROJECT_NAME:-vinsen_hosting}_network
    driver: bridge