map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$ http;
}

map $forwarded_proto $fastcgi_https {
    default off;
    https on;
}

upstream php_backend {
    server php_vinsen:9000;
    keepalive 16;
}

upstream reverb_backend {
    server reverb_vinsen:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    return 308 https://mdfarma.my.id$request_uri;
}

server {
    listen 80;
    server_name mdfarma.my.id;

    if ($forwarded_proto != https) {
        return 308 https://mdfarma.my.id$request_uri;
    }

    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 12m;
    server_tokens off;

    access_log /var/log/nginx/vinsen.access.log;
    error_log /var/log/nginx/vinsen.error.log;

    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host mdfarma.my.id;
        proxy_set_header Scheme $forwarded_proto;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host mdfarma.my.id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_pass http://reverb_backend;
    }

    location /apps {
        proxy_http_version 1.1;
        proxy_set_header Host mdfarma.my.id;
        proxy_set_header Scheme $forwarded_proto;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host mdfarma.my.id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_pass http://reverb_backend;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST mdfarma.my.id;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_pass_request_headers on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
